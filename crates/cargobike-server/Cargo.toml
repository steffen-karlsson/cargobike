[package]
name = "cargobike-server"
edition.workspace = true
rust-version.workspace = true
version.workspace = true
license.workspace = true
description = "Cargobike server: axum REST API, auth, webhooks, extension host"
publish = false

[dependencies]
cargobike-core = { path = "../cargobike-core" }
cargobike-engine = { path = "../cargobike-engine" }
cargobike-provider-github = { path = "../cargobike-provider-github" }
dbos = { workspace = true }
async-trait = { workspace = true }
url = "2.5.8"
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
time = { workspace = true }
uuid = { workspace = true }
secrecy = { workspace = true }
globset = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }

tokio = { workspace = true }
axum = { workspace = true }
tower-http = { workspace = true }
shellexpand = { workspace = true }
humantime = { workspace = true }
serde_yaml_ng = { workspace = true }
sqlx = { workspace = true }

jsonwebtoken = { workspace = true }
argon2 = { workspace = true }
moka = { workspace = true }
reqwest = { workspace = true }

rand_core = { version = "0.6", features = ["std", "getrandom"] }

clap = { version = "4", features = ["derive", "env", "wrap_help"] }

[dev-dependencies]
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
cargobike-engine = { path = "../cargobike-engine", features = ["crash-hooks"] }
argon2 = { workspace = true }
base64 = { workspace = true }
reqwest = { workspace = true }
pretty_assertions = { workspace = true }

[lints]
workspace = true
