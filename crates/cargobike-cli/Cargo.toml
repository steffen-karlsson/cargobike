[package]
name = "cargobike-cli"
edition.workspace = true
rust-version.workspace = true
version.workspace = true
license.workspace = true
description = "Cargobike CLI client (no database dependencies)"
publish = false

[lints]
workspace = true

[dependencies]
clap = { version = "4.6.7", features = ["derive", "env"] }
humantime.workspace = true
reqwest = { workspace = true, features = ["rustls-tls", "json"] }
reqwest-eventsource = "0.6"
futures-util = "0.3"
indicatif = "0.18"
time.workspace = true
secrecy.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml_ng.workspace = true
thiserror.workspace = true
uuid.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
url = "2.5.8"
# core: the offline validate (4.8) parses the server config and runs the
# shared registry rules + template compiler (A.14's CLI list allows core).
cargobike-core = { path = "../cargobike-core" }
# provider-github: F-10's strict half — `validate --resolve` verifies every
# declared `source.path` against the provider's own truth, and the provider
# crate owns the GitHub auth/path logic (octocrab). No database deps: G-10
# holds. The A.14 row names the addition.
cargobike-provider-github = { path = "../cargobike-provider-github" }
# miette: the validate's diagnostics (line/column source spans; A.14's
# CLI list).
miette = { version = "7", features = ["fancy"] }

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3"
pretty_assertions.workspace = true
wiremock = "0.6.5"

[[bin]]
name = "cargobike"
path = "src/main.rs"
