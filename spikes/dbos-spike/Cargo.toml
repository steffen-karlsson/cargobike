[package]
name = "dbos-spike"
version = "0.0.0"
edition = "2024"
publish = false

# Throwaway spike for PRD task 1.1: verify the DBOS Transact (Rust) model
# (steps, signals, sleep, cancel/resume/fork/delete, executor recovery)
# the engine (PRD Phase 3) builds on. NOT a workspace member.

[dependencies]
dbos = "0.5"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "1"

[lib]
name = "spike_lib"
path = "src/lib.rs"

[[bin]]
name = "waiter"
path = "src/main.rs"
