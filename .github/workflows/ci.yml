name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  pull-requests: write
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      # The integration phases' Postgres: a fixed URL the sqlx/DBOS tests
      # consume via CARGOBIKE_TEST_DATABASE_URL; the crash-injection
      # harness runs in this job too (its feature flag turns the hooks on).
      postgres:
        image: postgres:16
env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ["54329:5432"]
        # The workspace boots several servers/instances against this
        # fixture in parallel; the 100 default would starve them.
        command: ["-c", "max_connections=300"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: test
        run: cargo test --all-targets --features cargobike-engine/crash-hooks
        env:
          CARGOBIKE_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:54329/postgres

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - name: Install llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov
      - run: cargo llvm-cov --workspace --json > coverage.json
      - name: Extract coverage summary
        id: summary
        run: |
          python3 - <<'PY'
          import json, os
          from collections import defaultdict

          with open("coverage.json") as f:
              data = json.load(f)

          # Per-crate coverage: the workspace layout is crates/<crate>/src.
          files = data["data"][0]["files"]
          crates = defaultdict(lambda: {"count": 0, "covered": 0})

          for file_entry in files:
              path = file_entry["filename"].replace("\\", "/")
              parts = path.split("/")
              if len(parts) > 3 and parts[0] == "crates":
                  crate = parts[1]
              else:
                  crate = "other"
              summary = file_entry["summary"]
              crates[crate]["count"] += summary["lines"]["count"]
              crates[crate]["covered"] += summary["lines"]["covered"]

          total = data["data"][0]["totals"]
          overall_pct = round(total["lines"]["percent"], 2)

          lines = ["| Crate | Covered | Total | Coverage |", "|-------|---------|-------|----------|"]
          for crate in sorted(crates):
              stat = crates[crate]
              pct = round(stat["covered"] / stat["count"] * 100, 2) if stat["count"] else 0
              lines.append(f"| `{crate}` | {stat['covered']} | {stat['count']} | {pct}% |")
          lines.append(f"| **Total** | **{total['lines']['covered']}** | **{total['lines']['count']}** | **{overall_pct}%** |")

          table = "\n".join(lines)

          gh_output = os.environ.get("GITHUB_OUTPUT", "/dev/null")
          with open(gh_output, "a") as f:
              f.write(f"lines_pct={overall_pct}\n")
              f.write(f"table<<EOF\n{table}\nEOF\n")
          print(f"Line coverage: {overall_pct}%")
          PY
      - name: Find coverage comment
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: peter-evans/find-comment@v3
        id: fc
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: github-actions[bot]
          body-includes: Coverage Report
      - name: Post or update coverage comment
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-id: ${{ steps.fc.outputs.comment-id }}
          edit-mode: replace
          body: |
            ## Coverage Report

            ${{ steps.summary.outputs.table }}

            _Generated by `cargo llvm-cov`_

  audit:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-audit --locked
      - run: cargo audit --color never 2>&1 | tee audit-output.txt || true
      - name: Parse audit output
        id: audit
        run: |
          python3 - <<'PY'
          import os, re

          with open("audit-output.txt") as f:
              raw = f.read()

          clean = re.sub(r'\x1b\[[0-9;]*m', '', raw)

          lines = clean.strip().splitlines()
          findings = []
          current = {}
          for line in lines:
              if line.startswith("Crate:"):
                  if current:
                      findings.append(current)
                  current = {"crate": line.split(":", 1)[1].strip()}
              elif line.startswith("Version:"):
                  current["version"] = line.split(":", 1)[1].strip()
              elif line.startswith("Title:"):
                  current["title"] = line.split(":", 1)[1].strip()
              elif line.startswith("Date:"):
                  current["date"] = line.split(":", 1)[1].strip()
              elif line.startswith("ID:"):
                  current["id"] = line.split(":", 1)[1].strip()
              elif line.startswith("URL:"):
                  current["url"] = line.split(":", 1)[1].strip()
              elif line.startswith("Warning:"):
                  current["severity"] = line.split(":", 1)[1].strip()
              elif line.startswith("Severity:"):
                  current["severity"] = line.split(":", 1)[1].strip()
              elif line.startswith("Solution:"):
                  current["solution"] = line.split(":", 1)[1].strip()
          if current:
              findings.append(current)

          if not findings:
              body = "✅ No vulnerabilities or warnings found."
          else:
              vulns = [f for f in findings if f.get("severity") not in ("unmaintained", "unsound")]
              warns = [f for f in findings if f.get("severity") in ("unmaintained", "unsound")]

              parts = []
              if vulns:
                  parts.append(f"### 🔴 Vulnerabilities ({len(vulns)})\n")
                  for f in vulns:
                      parts.append(f"**{f['crate']}** `{f.get('version', '')}` — {f.get('title', '')}")
                      parts.append(f"- ID: `{f.get('id', '')}` | Severity: {f.get('severity', 'N/A')}")
                      if f.get('solution'):
                          parts.append(f"- Solution: {f['solution']}")
                      if f.get('url'):
                          parts.append(f"- [Advisory]({f['url']})")
                      parts.append("")

              if warns:
                  parts.append(f"### ⚠️ Warnings ({len(warns)})\n")
                  for f in warns:
                      parts.append(f"**{f['crate']}** `{f.get('version', '')}` — {f.get('title', '')}")
                      parts.append(f"- ID: `{f.get('id', '')}` | Type: {f.get('severity', '')}")
                      if f.get('url'):
                          parts.append(f"- [Advisory]({f['url']})")
                      parts.append("")

              body = "\n".join(parts)

          gh_output = os.environ.get("GITHUB_OUTPUT", "/dev/null")
          with open(gh_output, "a") as f:
              f.write(f"report<<EOF\n{body}\nEOF\n")
          PY
      - name: Find audit comment
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: peter-evans/find-comment@v3
        id: fc
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: github-actions[bot]
          body-includes: Security Audit Report
      - name: Post or update audit comment
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-id: ${{ steps.fc.outputs.comment-id }}
          edit-mode: replace
          body: |
            ## Security Audit Report

            ${{ steps.audit.outputs.report }}

            _Generated by `cargo audit`_

  deny:
    name: Deny policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: cargo-deny
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: ./Cargo.toml

  docs-currency:
    name: Documentation currency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: docs-check (the landed commit's set)
        run: ./scripts/docs-check.sh commit

  wasm:
    name: wasm32-wasip2 build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2
      - name: build core for wasm32-wasip2
        run: cargo build -p cargobike-core --target wasm32-wasip2

  build-matrix:
    # linux/amd64, linux/arm64, darwin/amd64, darwin/arm64.
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest          # linux/amd64
          - os: ubuntu-24.04-arm       # linux/arm64
          - os: macos-15-intel         # darwin/amd64
          - os: macos-latest           # darwin/arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: build
        run: cargo build --workspace
