# cargo-deny: licence policy, duplicate-version bans, advisories, sources.
# CI runs it via EmbarkStudios/cargo-deny-action; `make audit` still runs cargo audit.

[graph]
# The CLI/server targets plus the wasi target core must compile for.
targets = [
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "wasm32-wasip2" },
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "ISC",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
    # webpki-roots ships its bundled root-store data under a permissive
    # data licence.
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.93

[bans]
multiple-versions = "warn"
# The workspace's internal crates are path dependencies without a
# version field (they are not published from here), which cargo-deny
# would otherwise reject as wildcard dependencies.
wildcards = "allow"
deny = [
    # serde_yml is RUSTSEC-2025-0068; serde_yaml is archived.
    { name = "serde_yml", version = "*" },
    { name = "serde_yaml", version = "*" },
    { name = "openssl", version = "*" },
    { name = "native-tls", version = "*" },
]

[advisories]
version = 2
yanked = "warn"
ignore = [
    # The RSA crate has no patched release (the advisory's patched list is
    # intentionally empty). The exposed path here is GitHub App JWT
    # signing and OIDC RS256 verification through jsonwebtoken, whose
    # practical exposure to the timing channel is limited; tracked
    # upstream and to be revisited when a patched rsa ships.
    "RUSTSEC-2023-0071",
]
