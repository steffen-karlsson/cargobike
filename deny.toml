# cargo-deny: licence policy, duplicate-version bans, advisories, sources.
# CI runs it via EmbarkStudios/cargo-deny-action; `make audit` still runs cargo audit.

[graph]
# The CLI/server targets plus the wasi target core must compile for.
targets = [
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "wasm32-wasip2" },
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "ISC",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
    # webpki-roots ships its bundled root-store data under a permissive
    # data licence.
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.93

[bans]
multiple-versions = "warn"
# The workspace's internal crates are path dependencies without a
# version field (they are not published from here), which cargo-deny
# would otherwise reject as wildcard dependencies.
wildcards = "allow"
deny = [
    # serde_yml is RUSTSEC-2025-0068; serde_yaml is archived.
    { name = "serde_yml", version = "*" },
    { name = "serde_yaml", version = "*" },
    { name = "openssl", version = "*" },
    { name = "native-tls", version = "*" },
]

[advisories]
version = 2
yanked = "warn"
ignore = [
    # The RSA crate has no patched release (the advisory's patched list is
    # intentionally empty). The exposed path here is GitHub App JWT
    # signing and OIDC RS256 verification through jsonwebtoken, whose
    # practical exposure to the timing channel is limited; tracked
    # upstream and to be revisited when a patched rsa ships.
    "RUSTSEC-2023-0071",
    # crypto-bigint 0.5 constant-time gaps (RUSTSEC-2026-0387). The 0.5
    # line reaches us via jsonwebtoken 10 -> p256/p384 0.13, which octocrab
    # 0.54 (the provider's pinned API surface) also rides; the fix lives in
    # crypto-bigint 0.7 behind the RustCrypto 2025 stack, reachable only
    # through deliberate jsonwebtoken/octocrab major bumps. Timing side
    # channel in ECDSA P-256/P-384 verification; revisit with the next
    # octocrab pin bump.
    "RUSTSEC-2026-0387",
    # astral-tokio-tar is unmaintained (RUSTSEC-2026-0440). Pulled only by
    # testcontainers 0.27 inside cargobike-testsupport — a test-only
    # dependency that never ships in cargobike/cargobike-server. No safe
    # upgrade inside the 0.27 line (its companion testcontainers-modules
    # has not moved); drop this ignore when testcontainers drops the crate.
    "RUSTSEC-2026-0440",
    # unsafe-libyaml is unmaintained (RUSTSEC-2024-0449). serde_yaml_ng 0.10
    # — the PRD's approved YAML parser (Appendix A) — builds on it and has
    # no release off it. Migrating to a safe-Rust parser (saphyr) is a
    # deliberate project decision, not a patch; tracked in
    # docs/TODO-phase-audit.md.
    "RUSTSEC-2024-0449",
]
