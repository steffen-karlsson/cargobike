[workspace]
resolver = "3"
members = [
    "crates/cargobike-core",
    "crates/cargobike-api",
    "crates/cargobike-engine",
    "crates/cargobike-server",
    "crates/cargobike-cli",
    "crates/cargobike-extension-sdk",
    "crates/cargobike-provider-github",
]
# Spikes are throwaway prototypes with their own dependency set.
exclude = ["spikes"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "Durable release orchestration. Durable delivery, one pedal at a time."

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
time = { version = "0.3", features = ["serde", "serde-well-known"] }
uuid = { version = "1", features = ["v7", "std", "serde"] }
semver = "1"
dbos = "0.5"
cel = { version = "0.14", default-features = false, features = ["json"] }

globset = "0.4"
strum = { version = "0.27", features = ["derive"] }
async-trait = "0.1"
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
base64 = "0.22"
secrecy = { version = "0.10", features = ["serde"] }
bytes = "1"

# Server-side (Phase 2)
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time", "sync"] }
axum = { version = "0.8", features = ["http1", "json", "tokio", "tower-log"] }
tower-http = { version = "0.6", features = ["trace", "catch-panic", "limit", "sensitive-headers"] }
figment = { version = "0.10", features = ["yaml", "env"] }
shellexpand = "3"
humantime = "2"
humantime-serde = "1"
serde_yaml_ng = "0.10"
jsonwebtoken = { version = "10", features = ["rust_crypto"] }
argon2 = "0.5"
moka = { version = "0.12", features = ["sync"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
sqlx = { version = "0.9", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls", "migrate", "uuid", "time", "macros"] }


# Shared dev-dependencies (unit tests live in #[cfg(test)] mod tests, PRD 20.4)
rstest = "0.26"
pretty_assertions = "1"

[profile.release]
strip = true
lto = true
codegen-units = 1

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"

[workspace.lints.rust]
dead_code = "deny"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
